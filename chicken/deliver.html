<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a0f0a">
<title>德州扒鸡 — 兑换系统</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:#1a0f0a;color:#e8d5c4;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% 0,#2a1a10 0%,#1a0f0a 60%,#0d0805 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;
}
.container{max-width:480px;width:100%;margin:0 auto}
.card{background:linear-gradient(135deg,#2a1a10,#1f120a);border-radius:16px;padding:32px 24px;border:1px solid rgba(240,185,11,0.1);text-align:center}
h1{font-size:1.5rem;color:#f0b90b;margin-bottom:6px}
.sub{color:#a09080;font-size:0.85rem;margin-bottom:24px;line-height:1.5}
.logo{font-size:3rem;margin-bottom:12px}
.input-group{display:flex;gap:8px;margin-bottom:12px}
.input-group input{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(240,185,11,0.2);background:rgba(0,0,0,0.3);color:#e8d5c4;font-size:1rem;text-align:center;outline:none}
.input-group input:focus{border-color:#f0b90b}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:1rem;font-weight:700;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg,#f0b90b,#d4a008);color:#1a0f0a}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(240,185,11,0.2)}
.btn-secondary{background:rgba(100,120,140,0.15);color:#a09080;border:1px solid rgba(100,120,140,0.2)!important;margin-top:8px}
.btn-secondary:hover{color:#e8d5c4}
.msg{margin-top:12px;font-size:0.85rem;min-height:24px;padding:8px;border-radius:8px}
.msg.success{background:rgba(68,204,68,0.1);color:#44cc44;border:1px solid rgba(68,204,68,0.2)}
.msg.error{background:rgba(255,68,68,0.1);color:#ff4444;border:1px solid rgba(255,68,68,0.2)}
.msg.info{background:rgba(240,185,11,0.1);color:#f0b90b;border:1px solid rgba(240,185,11,0.2)}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(240,185,11,0.1)}
.admin-header h2{font-size:1.1rem;color:#f0b90b}
.counter-display{font-size:0.85rem;color:#a09080}
.code-result{background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;margin:12px 0;word-break:break-all}
.code-result .link{font-size:0.9rem;color:#f0b90b;font-weight:600;margin-bottom:8px}
.code-result .hint{font-size:0.75rem;color:#6a8a6a;margin-top:4px}
.copy-btn{padding:6px 16px;border-radius:6px;background:rgba(240,185,11,0.15);color:#f0b90b;border:1px solid rgba(240,185,11,0.2);cursor:pointer;font-size:0.8rem;transition:all 0.2s}
.copy-btn:hover{background:rgba(240,185,11,0.25)}
.history{margin-top:16px;text-align:left;max-height:200px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;font-size:0.8rem;color:#a09080;margin:2px 0}
.history-item:nth-child(odd){background:rgba(0,0,0,0.15)}
.history-item .h-code{color:#e8d5c4;font-family:monospace}
.history-item .h-date{font-size:0.7rem}
.batch-group{display:flex;gap:8px;margin:8px 0}
.batch-group select{padding:8px;border-radius:8px;border:1px solid rgba(240,185,11,0.2);background:rgba(0,0,0,0.3);color:#e8d5c4;font-size:0.85rem;outline:none;flex:1}
.count-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:0.7rem;background:rgba(240,185,11,0.15);color:#f0b90b;margin-top:8px}
.login-form{text-align:center;padding:20px}
.login-form input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(240,185,11,0.2);background:rgba(0,0,0,0.3);color:#e8d5c4;font-size:1rem;text-align:center;outline:none;margin-bottom:12px}
.login-form input:focus{border-color:#f0b90b}
.logout-link{display:inline-block;margin-top:12px;font-size:0.8rem;color:#a09080;cursor:pointer}
.logout-link:hover{color:#f0b90b}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(240,185,11,0.2);border-top-color:#f0b90b;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.copy-feedback{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(68,204,68,0.9);color:#fff;padding:8px 20px;border-radius:8px;font-size:0.85rem;animation:fadeIn 0.3s;z-index:999}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:400px){.card{padding:20px 16px}}
</style>
</head>
<body>
<div class="container">
<div class="card" id="app">
  <div class="logo">🐤</div>
  <h1>德州扒鸡</h1>
  <div class="sub" id="sub-text">兑换系统</div>
  <div id="content"></div>
</div>
</div>

<script>
/* ==============================
   CONFIG
   ============================== */
const ADMIN_PASSWORD = 'ryj2225';
const GAME_URL = 'https://baiyunzhi.github.io/poker-ocean/chicken/index.html';
const REDEEM_SECRET = 'poker-chkn-2026-ryj2225';
const CODE_PREFIX = 'CHKN';
const ADMIN_COUNTER_KEY = 'poker_admin_counter';

/* ==============================
   CRYPTO
   ============================== */
async function hmacSign(msg, secret) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(String(msg)));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}

async function generateCode(counter) {
  const hex = await hmacSign(counter, REDEEM_SECRET);
  return CODE_PREFIX + '-' + String(counter).padStart(4, '0') + '-' + hex.substring(0, 8);
}

async function validateCode(code) {
  if (!code || typeof code !== 'string') return false;
  code = code.trim().toUpperCase();
  const parts = code.split('-');
  if (parts.length !== 3 || parts[0] !== CODE_PREFIX) return false;
  const counter = parseInt(parts[1], 10);
  if (isNaN(counter) || counter < 0) return false;
  const expected = await generateCode(counter);
  return expected === code;
}

/* ==============================
   ADMIN
   ============================== */
function getCounter() {
  return parseInt(localStorage.getItem(ADMIN_COUNTER_KEY) || '0');
}

function setCounter(val) {
  localStorage.setItem(ADMIN_COUNTER_KEY, String(val));
}

function getHistory() {
  return JSON.parse(localStorage.getItem('poker_code_history') || '[]');
}

function addHistory(counter, code) {
  const h = getHistory();
  h.unshift({ counter: counter, code: code, date: new Date().toLocaleString('zh-CN') });
  if (h.length > 100) h.length = 100;
  localStorage.setItem('poker_code_history', JSON.stringify(h));
}

async function renderAdmin() {
  const c = document.getElementById('content');
  const counter = getCounter();

  let historyHtml = '';
  const history = getHistory();
  for (const item of history.slice(0, 20)) {
    const link = GAME_URL + '?code=' + item.code;
    historyHtml += '<div class="history-item"><span class="h-code">' + item.code + '</span><button class="copy-btn" onclick="copyText(\'' + link + '\')">复制链接</button></div>';
  }

  c.innerHTML = '<div class="admin-header"><h2>🔑 管理后台</h2><div class="counter-display">已生成: <strong id="counter-val">' + counter + '</strong> 个</div></div>' +
    '<div class="batch-group">' +
    '<select id="batch-count"><option value="1">生成 1 个</option><option value="5">生成 5 个</option><option value="10">生成 10 个</option><option value="20">生成 20 个</option></select>' +
    '<button class="btn btn-primary" style="flex:0 0 auto;padding:12px 20px;width:auto" onclick="batchGenerate()">生成</button>' +
    '</div>' +
    '<div id="code-results"></div>' +
    '<div class="history" id="history-list">' + historyHtml + '</div>' +
    '<div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(240,185,11,0.1)">' +
    '<button class="btn btn-secondary" onclick="location.href=\'deliver.html\'">退出管理</button>' +
    '</div>';
}

async function batchGenerate() {
  const count = parseInt(document.getElementById('batch-count').value);
  const resultsDiv = document.getElementById('code-results');
  resultsDiv.innerHTML = '<div class="msg info"><span class="spinner"></span>生成中...</div>';

  let codes = [];
  let currentCounter = getCounter();

  for (let i = 0; i < count; i++) {
    const code = await generateCode(currentCounter);
    const link = GAME_URL + '?code=' + code;
    codes.push({ counter: currentCounter, code: code, link: link });
    addHistory(currentCounter, code);
    currentCounter++;
  }

  setCounter(currentCounter);
  document.getElementById('counter-val').textContent = currentCounter;

  let html = '<div class="count-badge">✅ 已生成 ' + count + ' 个兑换码</div>';
  for (const item of codes) {
    html += '<div class="code-result"><div class="link">' + item.code + '</div>' +
      '<button class="copy-btn" onclick="copyText(\'' + item.link + '\')">📋 复制链接</button>' +
      '<div class="hint">' + item.link + '</div></div>';
  }
  resultsDiv.innerHTML = html;

  // Refresh history
  let historyHtml = '';
  const history = getHistory();
  for (const item of history.slice(0, 20)) {
    const link = GAME_URL + '?code=' + item.code;
    historyHtml += '<div class="history-item"><span class="h-code">' + item.code + '</span><button class="copy-btn" onclick="copyText(\'' + link + '\')">复制链接</button></div>';
  }
  document.getElementById('history-list').innerHTML = historyHtml;
}

/* ==============================
   REDEEM
   ============================== */
function showRedeem() {
  const c = document.getElementById('content');
  document.getElementById('sub-text').textContent = '输入兑换码，永久解锁全部游戏';
  c.innerHTML = '<div class="input-group"><input type="text" id="redeem-input" placeholder="输入兑换码" onkeydown="if(event.key===\'Enter\')doRedeem()"></div>' +
    '<button class="btn btn-primary" onclick="doRedeem()">🚀 立即解锁</button>' +
    '<div class="msg" id="redeem-msg"></div>' +
    '<button class="btn btn-secondary" onclick="showHelp()">如何获取兑换码？</button>';
  document.getElementById('redeem-input').focus();
}

async function doRedeem() {
  const input = document.getElementById('redeem-input');
  const msg = document.getElementById('redeem-msg');
  const code = input.value.trim();

  if (!code) { msg.className = 'msg error'; msg.textContent = '请输入兑换码'; return; }

  msg.className = 'msg info';
  msg.innerHTML = '<span class="spinner"></span>验证中...';

  const valid = await validateCode(code);
  if (valid) {
    localStorage.setItem('poker_unlocked', 'true');
    msg.className = 'msg success';
    msg.textContent = '🎉 解锁成功！正在跳转游戏...';
    setTimeout(function() { window.location.href = GAME_URL; }, 1000);
  } else {
    msg.className = 'msg error';
    msg.textContent = '❌ 兑换码无效，请检查后重试';
  }
}

function showHelp() {
  const msg = document.getElementById('redeem-msg');
  msg.className = 'msg info';
  msg.innerHTML = '添加微信 <strong>ryj2225</strong> 购买永久解锁<br>支付29.9元后获取兑换码';
}

/* ==============================
   UTILITY
   ============================== */
function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showCopyFeedback('✅ 已复制到剪贴板');
    });
  } else {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showCopyFeedback('✅ 已复制到剪贴板');
  }
}

function showCopyFeedback(msg) {
  const el = document.createElement('div');
  el.className = 'copy-feedback'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}

/* ==============================
   INIT
   ============================== */
(async function() {
  const params = new URLSearchParams(window.location.search);
  const adminPass = params.get('admin');
  const codeParam = params.get('code');

  if (adminPass === ADMIN_PASSWORD) {
    document.getElementById('sub-text').textContent = '管理员后台 — 生成兑换码';
    await renderAdmin();
  } else if (adminPass !== null) {
    document.getElementById('sub-text').textContent = '密码错误';
    document.getElementById('content').innerHTML = '<div class="msg error">管理员密码错误</div><button class="btn btn-secondary" onclick="location.href=\'deliver.html\'">返回</button>';
  } else if (codeParam) {
    document.getElementById('sub-text').textContent = '验证兑换码...';
    document.getElementById('content').innerHTML = '<div class="msg info"><span class="spinner"></span>验证中...</div>';
    const valid = await validateCode(codeParam);
    if (valid) {
      localStorage.setItem('poker_unlocked', 'true');
      document.getElementById('sub-text').textContent = '✅ 解锁成功！';
      document.getElementById('content').innerHTML = '<div class="msg success">🎉 永久解锁成功！正在跳转游戏...</div>';
      setTimeout(function() { window.location.href = GAME_URL; }, 800);
    } else {
      document.getElementById('sub-text').textContent = '兑换码无效';
      document.getElementById('content').innerHTML = '<div class="msg error">❌ 兑换码无效，请检查链接是否正确</div><button class="btn btn-secondary" style="margin-top:12px" onclick="showRedeem()">手动输入兑换码</button>';
    }
  } else {
    showRedeem();
  }
})();
</script>
</body>
</html>
