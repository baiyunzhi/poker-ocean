<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期货大师模拟器</title>
<script src="/static/lightweight-charts.standalone.production.js"></script>
<script>window.addEventListener('error',function(e){if(e.target.tagName==='SCRIPT'&&e.target.src.indexOf('lightweight-charts')>-1){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.2.1/lightweight-charts.standalone.production.js"><\/script>');}},true);</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b0e14;
  color:#d0d4dc;
  font-family:-apple-system,'Microsoft YaHei',sans-serif;
  font-size:14px;
  min-height:100vh;
}
/* ─── Top Bar ─────────────────── */
.topbar{
  background:#151920;
  border-bottom:1px solid #1f2530;
  padding:12px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.logo{font-size:20px;font-weight:700;color:#f0b90b;letter-spacing:1px}
.logo span{color:#5e7ce0}
.acc-summary{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.acc-item{display:flex;flex-direction:column;align-items:center;min-width:80px}
.acc-label{color:#6b7280;font-size:11px;text-transform:uppercase}
.acc-value{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.acc-value.positive{color:#0ecb81}
.acc-value.negative{color:#f6465d}
.acc-value.warning{color:#f0b90b}
.risk-low{color:#0ecb81}
.risk-mid{color:#f0b90b}
.risk-high{color:#f6465d}
/* ─── Main Grid ───────────────── */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:16px 24px;
}
.panel{
  background:#151920;
  border-radius:8px;
  border:1px solid #1f2530;
  padding:16px;
}
.panel h3{
  font-size:13px;
  color:#6b7280;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid #1f2530;
}
/* ─── Market ──────────────────── */
.market-table{width:100%;border-collapse:collapse}
.market-table th{
  text-align:left;
  padding:8px 6px;
  font-size:11px;
  color:#6b7280;
  text-transform:uppercase;
  border-bottom:1px solid #1f2530;
}
.market-table td{
  padding:10px 6px;
  border-bottom:1px solid #1a1f2a;
  font-variant-numeric:tabular-nums;
}
.market-table tr:last-child td{border-bottom:none}
.prod-name{font-weight:600;color:#e8ecf0}
.prod-price{font-size:18px;font-weight:700}
.prod-change{font-size:13px;font-weight:600}
.up{color:#0ecb81}
.down{color:#f6465d}
/* ─── Trading Panel ───────────── */
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}
.form-row select,.form-row input{
  width:100%;
  padding:10px 12px;
  background:#0b0e14;
  border:1px solid #1f2530;
  border-radius:6px;
  color:#d0d4dc;
  font-size:14px;
  outline:none;
}
.form-row select:focus,.form-row input:focus{border-color:#5e7ce0}
.dir-group{display:flex;gap:8px}
.dir-btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}
.dir-btn.long{background:#0ecb81;color:#fff}
.dir-btn.long:hover{background:#0ab870}
.dir-btn.long.active{box-shadow:0 0 0 2px #0ecb81}
.dir-btn.short{background:#f6465d;color:#fff}
.dir-btn.short:hover{background:#d93a4f}
.dir-btn.short.active{box-shadow:0 0 0 2px #f6465d}
.vol-control{display:flex;align-items:center;gap:4px}
.vol-control button{
  width:36px;height:36px;
  background:#0b0e14;border:1px solid #1f2530;
  color:#d0d4dc;font-size:18px;border-radius:4px;
  cursor:pointer;
}
.vol-control button:hover{background:#1f2530}
.vol-control input{text-align:center;width:72px}
.lev-control{display:flex;align-items:center;gap:10px}
.lev-control input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:#1f2530;border-radius:2px;outline:none}
.lev-control input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#f0b90b;cursor:pointer}
.lev-value{font-weight:700;font-size:16px;color:#f0b90b;min-width:32px}
.margin-preview{font-size:13px;color:#6b7280;padding:8px 12px;background:#0b0e14;border-radius:6px}
.trade-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
  margin-top:4px;
}
.trade-btn.long{background:linear-gradient(135deg,#0ecb81,#0ab870);color:#fff}
.trade-btn.short{background:linear-gradient(135deg,#f6465d,#d93a4f);color:#fff}
.trade-btn:disabled{opacity:.4;cursor:not-allowed}
.result-msg{
  margin-top:10px;padding:10px;border-radius:6px;
  font-size:13px;display:none;text-align:center;
}
.result-msg.success{display:block;background:rgba(14,203,129,.12);color:#0ecb81;border:1px solid rgba(14,203,129,.2)}
.result-msg.error{display:block;background:rgba(246,70,93,.12);color:#f6465d;border:1px solid rgba(246,70,93,.2)}
/* ─── Positions ───────────────── */
.full-width{grid-column:1/-1}
.trades-table{width:100%;border-collapse:collapse}
.trades-table th{
  text-align:left;
  padding:10px 8px;
  font-size:11px;
  color:#6b7280;
  text-transform:uppercase;
  border-bottom:1px solid #1f2530;
  white-space:nowrap;
}
.trades-table td{
  padding:12px 8px;
  border-bottom:1px solid #1a1f2a;
  font-variant-numeric:tabular-nums;
}
.trades-table tr:last-child td{border-bottom:none}
.trades-table tr:hover td{background:rgba(94,124,224,.04)}
.badge-long{
  display:inline-block;padding:2px 8px;border-radius:4px;
  background:rgba(14,203,129,.15);color:#0ecb81;font-size:12px;font-weight:600;
}
.badge-short{
  display:inline-block;padding:2px 8px;border-radius:4px;
  background:rgba(246,70,93,.15);color:#f6465d;font-size:12px;font-weight:600;
}
.btn-close{
  padding:5px 14px;border:none;border-radius:4px;
  background:#5e7ce0;color:#fff;font-size:12px;
  cursor:pointer;transition:.15s;
}
.btn-close:hover{background:#4a67c9}
.btn-reset{
  padding:6px 16px;border:1px solid #1f2530;border-radius:6px;
  background:transparent;color:#6b7280;font-size:12px;
  cursor:pointer;transition:.15s;
}
.btn-reset:hover{border-color:#f6465d;color:#f6465d}
.empty-state{text-align:center;padding:32px;color:#6b7280;font-size:13px}
/* ─── History ─────────────────── */
.history-scroll{max-height:200px;overflow-y:auto}
.history-scroll::-webkit-scrollbar{width:4px}
.history-scroll::-webkit-scrollbar-thumb{background:#1f2530;border-radius:2px}
/* ─── Responsive ──────────────── */
@media(max-width:768px){
  .grid{grid-template-columns:1fr;padding:12px}
  .topbar{padding:10px 16px}
  .acc-summary{gap:12px}
}
/* ─── Chart ───────────────────── */
.chart-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.chart-toolbar select{
  padding:6px 10px;background:#0b0e14;border:1px solid #1f2530;
  border-radius:4px;color:#d0d4dc;font-size:12px;outline:none;
}
.chart-toolbar select:focus{border-color:#5e7ce0}
.period-btn{
  padding:6px 14px;border:1px solid #1f2530;border-radius:4px;
  background:transparent;color:#6b7280;font-size:12px;
  cursor:pointer;transition:.15s;font-family:inherit;
}
.period-btn:hover{border-color:#5e7ce0;color:#d0d4dc}
.period-btn.active{background:#5e7ce0;border-color:#5e7ce0;color:#fff}
#chartContainer{width:100%;height:480px}

/* ─── Signals ─────────────────── */
.signal-scroll{max-height:260px;overflow-y:auto}
.signal-scroll::-webkit-scrollbar{width:4px}
.signal-scroll::-webkit-scrollbar-thumb{background:#1f2530;border-radius:2px}
.signal-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  border-radius:6px;
  margin-bottom:6px;
  background:#0b0e14;
  border-left:3px solid #6b7280;
}
.signal-item:last-child{margin-bottom:0}
.signal-item.severity-info{border-left-color:#3498db}
.signal-item.severity-warning{border-left-color:#f39c12}
.signal-item.severity-critical{border-left-color:#e74c3c}
.signal-time{font-size:11px;color:#6b7280;white-space:nowrap;min-width:60px}
.signal-prod-tag{
  font-size:11px;font-weight:600;
  padding:2px 6px;border-radius:3px;
  background:#1f2530;color:#5e7ce0;
  white-space:nowrap;min-width:36px;text-align:center;
}
.signal-body{flex:1;min-width:0}
.signal-title{font-size:13px;font-weight:600;color:#e8ecf0}
.signal-detail{font-size:11px;color:#6b7280;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signal-badge{
  font-size:10px;padding:2px 6px;border-radius:3px;
  white-space:nowrap;font-weight:600;
}
.signal-badge.info{background:rgba(52,152,219,.15);color:#3498db}
.signal-badge.warning{background:rgba(243,156,18,.15);color:#f39c12}
.signal-badge.critical{background:rgba(231,76,60,.15);color:#e74c3c}

/* ─── Signal Toast ─────────────── */
.signal-toast{
  position:fixed;top:16px;right:16px;z-index:9999;
  padding:12px 20px;border-radius:8px;
  background:#1a1f2a;border:1px solid #1f2530;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  max-width:360px;
  animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;
  pointer-events:none;
}
.signal-toast .toast-title{font-size:14px;font-weight:600;margin-bottom:4px}
.signal-toast .toast-detail{font-size:12px;color:#6b7280}
@keyframes toastIn{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:translateX(0)}}
@keyframes toastOut{0%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">⬡ <span>期货大师</span> 模拟器</div>
  <div class="acc-summary" id="accountSummary">
    <div class="acc-item"><span class="acc-label">总资产(净值)</span><span class="acc-value" id="equity">¥1,000,000</span></div>
    <div class="acc-item"><span class="acc-label">可用资金</span><span class="acc-value" id="free">¥1,000,000</span></div>
    <div class="acc-item"><span class="acc-label">占用保证金</span><span class="acc-value" id="usedMargin">¥0</span></div>
    <div class="acc-item"><span class="acc-label">浮动盈亏</span><span class="acc-value" id="totalPnl">¥0</span></div>
    <div class="acc-item"><span class="acc-label">风险率</span><span class="acc-value" id="riskRate">--</span></div>
    <div class="acc-item"><button class="btn-reset" onclick="resetAccount()">重置账户</button></div>
  </div>
</div>

<!-- Main Grid -->
<div class="grid">

  <!-- Market Panel -->
  <div class="panel">
    <h3>实时行情</h3>
    <table class="market-table" id="marketTable">
      <thead><tr><th>品种</th><th>最新价</th><th>涨跌幅</th></tr></thead>
      <tbody id="marketBody">
        <tr><td class="prod-name">黄金 AU</td><td class="prod-price" id="p-AU">--</td><td class="prod-change" id="c-AU">--</td></tr>
        <tr><td class="prod-name">原油 SC</td><td class="prod-price" id="p-SC">--</td><td class="prod-change" id="c-SC">--</td></tr>
        <tr><td class="prod-name">沪深300 IF</td><td class="prod-price" id="p-IF">--</td><td class="prod-change" id="c-IF">--</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Trading Panel -->
  <div class="panel">
    <h3>交易面板</h3>
    <div class="form-row">
      <label>品种</label>
      <select id="productSelect">
        <option value="AU">黄金 AU</option>
        <option value="SC">原油 SC</option>
        <option value="IF">沪深300 IF</option>
      </select>
    </div>
    <div class="form-row">
      <label>方向</label>
      <div class="dir-group">
        <button class="dir-btn long active" data-dir="long" onclick="setDirection('long')">买涨</button>
        <button class="dir-btn short" data-dir="short" onclick="setDirection('short')">买跌</button>
      </div>
    </div>
    <div class="form-row">
      <label>手数</label>
      <div class="vol-control">
        <button onclick="changeVol(-1)">−</button>
        <input type="number" id="volumeInput" value="1" min="1" max="100" readonly>
        <button onclick="changeVol(1)">+</button>
      </div>
    </div>
    <div class="form-row">
      <label>杠杆</label>
      <div class="lev-control">
        <input type="range" id="leverageSlider" min="1" max="20" value="10" oninput="updateLeverage()">
        <span class="lev-value" id="leverageDisplay">10x</span>
      </div>
    </div>
    <div class="margin-preview" id="marginPreview">占用保证金: ¥--</div>
    <button class="trade-btn" id="tradeBtn" onclick="submitOrder()">开仓</button>
    <div class="result-msg" id="resultMsg"></div>
  </div>

  <!-- K-line Chart -->
  <div class="panel full-width">
    <h3>K 线图</h3>
    <div class="chart-toolbar">
      <select id="chartProduct">
        <option value="AU">黄金 AU</option>
        <option value="SC">原油 SC</option>
        <option value="IF">沪深300 IF</option>
      </select>
      <button class="period-btn active" data-period="1h">小时线</button>
      <button class="period-btn" data-period="1d">日线</button>
      <span style="color:#6b7280;font-size:11px;margin-left:auto">
        <span style="color:#f0b90b">MA20</span>
        <span style="color:#e91e63;margin-left:8px">MA60</span>
        <span style="color:#7c4dff;margin-left:8px">MA120</span>
      </span>
    </div>
    <div id="chartContainer"></div>
  </div>

  <!-- Trading Signals -->
  <div class="panel full-width">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;padding:0;border:none">📡 交易信号</h3>
      <span id="signalBadge" style="font-size:11px;color:#6b7280">等待信号...</span>
    </div>
    <div class="signal-scroll" id="signalContainer">
      <div class="empty-state">暂无交易信号</div>
    </div>
  </div>

  <!-- Positions -->
  <div class="panel full-width">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;padding:0;border:none">当前持仓</h3>
    </div>
    <div id="positionsContainer">
      <div class="empty-state">暂无持仓</div>
    </div>
  </div>

  <!-- Trade History -->
  <div class="panel full-width">
    <h3>交易历史</h3>
    <div class="history-scroll" id="historyContainer">
      <div class="empty-state">暂无交易记录</div>
    </div>
  </div>

</div>

<script>
// ─── State ──────────────────────
let currentDir = 'long';
let currentLeverage = 10;

// ─── Signal State ────────────────
let allSignals = [];

// ─── Direction ───────────────────
function setDirection(dir) {
  currentDir = dir;
  document.querySelectorAll('.dir-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.dir === dir);
  });
  updateTradeBtn();
}

function updateTradeBtn() {
  const btn = document.getElementById('tradeBtn');
  if (currentDir === 'long') {
    btn.className = 'trade-btn long';
    btn.textContent = '买涨开仓';
  } else {
    btn.className = 'trade-btn short';
    btn.textContent = '买跌开仓';
  }
}

// ─── Volume ──────────────────────
function changeVol(delta) {
  const inp = document.getElementById('volumeInput');
  let v = parseInt(inp.value) + delta;
  if (v < 1) v = 1;
  if (v > 100) v = 100;
  inp.value = v;
  updateMarginPreview();
}

// ─── Leverage ────────────────────
function updateLeverage() {
  const slider = document.getElementById('leverageSlider');
  currentLeverage = parseInt(slider.value);
  document.getElementById('leverageDisplay').textContent = currentLeverage + 'x';
  updateMarginPreview();
}

// ─── Margin Preview ──────────────
function updateMarginPreview() {
  const pid = document.getElementById('productSelect').value;
  const vol = parseInt(document.getElementById('volumeInput').value);
  // use last known price from market
  const priceEl = document.getElementById('p-' + pid);
  const price = priceEl.dataset.price ? parseFloat(priceEl.dataset.price) : 2350;
  const multipliers = {AU: 1000, SC: 1000, IF: 300};
  const mul = multipliers[pid] || 1000;
  const margin = price * mul * vol / currentLeverage;
  document.getElementById('marginPreview').textContent = '占用保证金: ¥' + margin.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

document.getElementById('productSelect').addEventListener('change', updateMarginPreview);
document.getElementById('volumeInput').addEventListener('input', updateMarginPreview);

// ─── Format helpers ──────────────
function fmt(v) { return '¥' + Number(v).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function fmtPnl(v) { return (v >= 0 ? '+' : '') + '¥' + v.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

// ─── Submit Order ────────────────
async function submitOrder() {
  const pid = document.getElementById('productSelect').value;
  const vol = parseInt(document.getElementById('volumeInput').value);
  const btn = document.getElementById('tradeBtn');
  const msg = document.getElementById('resultMsg');
  btn.disabled = true;
  msg.className = 'result-msg';
  msg.style.display = 'none';
  try {
    const r = await fetch('/api/orders?pid=' + pid + '&direction=' + currentDir + '&volume=' + vol + '&leverage=' + currentLeverage, {method: 'POST'});
    const d = await r.json();
    msg.className = 'result-msg ' + (d.success ? 'success' : 'error');
    msg.textContent = d.msg || (d.success ? '开仓成功' : '开仓失败');
    msg.style.display = 'block';
  } catch(e) {
    msg.className = 'result-msg error';
    msg.textContent = '网络错误';
    msg.style.display = 'block';
  }
  btn.disabled = false;
  setTimeout(() => { msg.style.display = 'none'; }, 3000);
}

// ─── Close Position ──────────────
async function closePosition(id) {
  const r = await fetch('/api/orders/' + id + '/close', {method: 'POST'});
  return r.json();
}

// ─── Signals ─────────────────────
function addSignals(newSignals) {
  for (const s of newSignals) {
    if (allSignals.some(ex => ex.id === s.id)) continue;
    allSignals.unshift(s);
  }
  if (allSignals.length > 100) allSignals.length = 100;
  renderSignals();
}

function renderSignals() {
  const container = document.getElementById('signalContainer');
  const badge = document.getElementById('signalBadge');
  if (!container) return;
  if (allSignals.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无交易信号</div>';
    badge.textContent = '等待信号...';
    return;
  }
  badge.textContent = '共 ' + allSignals.length + ' 条';
  let html = '';
  for (const s of allSignals) {
    const sev = s.severity || 'info';
    const time = new Date(s.time * 1000).toLocaleTimeString('zh-CN', {hour12: false});
    const sevLabel = sev === 'critical' ? '严重' : sev === 'warning' ? '警告' : '提示';
    html += '<div class="signal-item severity-' + sev + '">' +
      '<span class="signal-time">' + time + '</span>' +
      '<span class="signal-prod-tag">' + s.product + '</span>' +
      '<div class="signal-body">' +
        '<div class="signal-title">' + s.title + '</div>' +
        '<div class="signal-detail">' + (s.detail || '') + '</div>' +
      '</div>' +
      '<span class="signal-badge ' + sev + '">' + sevLabel + '</span>' +
    '</div>';
  }
  container.innerHTML = html;
}

function showSignalToast(signal) {
  const existing = document.querySelector('.signal-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'signal-toast';
  const color = signal.severity === 'critical' ? '#e74c3c' : signal.severity === 'warning' ? '#f39c12' : '#3498db';
  toast.innerHTML =
    '<div class="toast-title" style="color:' + color + '">' + signal.title + ' — ' + signal.product_name + '</div>' +
    '<div class="toast-detail">' + (signal.detail || '') + '</div>';
  document.body.appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.remove(); }, 3000);
}

// ─── Reset Account ───────────────
async function resetAccount() {
  if (!confirm('确定要重置账户吗？所有持仓将被清空。')) return;
  await fetch('/api/reset', {method: 'POST'});
}

// ─── WebSocket ───────────────────
let ws = null;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.type === 'tick') {
      updateMarket(data.market);
      updateAccount(data.account);
      updatePositions(data.positions);
      updateChartTick(data.kline_latest);
    } else if (data.type === 'order_result') {
      const msg = document.getElementById('resultMsg');
      msg.className = 'result-msg ' + (data.success ? 'success' : 'error');
      msg.textContent = data.msg;
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 3000);
    } else if (data.type === 'signal') {
      addSignals(data.signals);
      data.signals.forEach(function(s) { showSignalToast(s); });
    }
  };
  ws.onclose = function() { setTimeout(connectWS, 1000); };
  ws.onerror = function() { ws.close(); };
}

// ─── UI Update Functions ─────────
function updateMarket(market) {
  for (const [pid, info] of Object.entries(market)) {
    const priceEl = document.getElementById('p-' + pid);
    const changeEl = document.getElementById('c-' + pid);
    if (!priceEl) continue;
    const isUp = info.change >= 0;
    priceEl.textContent = info.price.toFixed(2);
    priceEl.dataset.price = info.price;
    priceEl.className = 'prod-price ' + (isUp ? 'up' : 'down');
    changeEl.textContent = (isUp ? '+' : '') + info.change.toFixed(2) + '%';
    changeEl.className = 'prod-change ' + (isUp ? 'up' : 'down');
  }
}

function updateAccount(acc) {
  document.getElementById('equity').textContent = fmt(acc.equity);
  document.getElementById('equity').className = 'acc-value' + (acc.total_pnl >= 0 ? ' positive' : ' negative');
  document.getElementById('free').textContent = fmt(acc.free);
  document.getElementById('usedMargin').textContent = fmt(acc.used_margin);
  document.getElementById('totalPnl').textContent = fmtPnl(acc.total_pnl);
  document.getElementById('totalPnl').className = 'acc-value' + (acc.total_pnl >= 0 ? ' positive' : ' negative');
  const riskEl = document.getElementById('riskRate');
  const rate = acc.risk_rate;
  if (rate >= 1) {
    riskEl.textContent = '--';
    riskEl.className = 'acc-value';
  } else {
    riskEl.textContent = (rate * 100).toFixed(1) + '%';
    riskEl.className = 'acc-value ' + (rate < 0.15 ? 'risk-low' : rate < 0.3 ? 'risk-mid' : 'risk-high');
  }
}

function updatePositions(positions) {
  const container = document.getElementById('positionsContainer');
  if (!positions || positions.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无持仓</div>';
    return;
  }
  let html = `<table class="trades-table"><thead><tr>
    <th>品种</th><th>方向</th><th>手数</th><th>杠杆</th><th>开仓价</th><th>现价</th>
    <th>浮动盈亏</th><th>盈亏%</th><th>保证金</th><th>开仓时间</th><th>操作</th>
  </tr></thead><tbody>`;
  for (const p of positions) {
    const isLong = p.direction === 'long';
    const pnlClass = p.pnl >= 0 ? 'up' : 'down';
    html += `<tr>
      <td class="prod-name">${p.product_name}</td>
      <td><span class="badge-${isLong ? 'long' : 'short'}">${isLong ? '多' : '空'}</span></td>
      <td>${p.volume}</td>
      <td>${p.leverage}x</td>
      <td>${p.entry_price.toFixed(2)}</td>
      <td>${p.current_price.toFixed(2)}</td>
      <td class="${pnlClass}">${fmtPnl(p.pnl)}</td>
      <td class="${pnlClass}">${fmtPct(p.pnl_percent)}</td>
      <td>${fmt(p.margin)}</td>
      <td style="color:#6b7280;font-size:12px">${p.entry_time}</td>
      <td><button class="btn-close" onclick="doClose('${p.id}')">平仓</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

async function doClose(id) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '...';
  await closePosition(id);
  btn.disabled = false;
  btn.textContent = '平仓';
}

// ─── Load History on mount ───────
async function loadHistory() {
  const r = await fetch('/api/history');
  const history = await r.json();
  const container = document.getElementById('historyContainer');
  if (!history || history.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无交易记录</div>';
    return;
  }
  let html = `<table class="trades-table"><thead><tr>
    <th>品种</th><th>方向</th><th>手数</th><th>开仓价</th><th>平仓价</th>
    <th>盈亏</th><th>时间</th>
  </tr></thead><tbody>`;
  for (const t of history) {
    const isLong = t.direction === 'long';
    const pnlClass = t.realized_pnl >= 0 ? 'up' : 'down';
    html += `<tr>
      <td class="prod-name">${t.product_name}</td>
      <td><span class="badge-${isLong ? 'long' : 'short'}">${isLong ? '多' : '空'}</span></td>
      <td>${t.volume}</td>
      <td>${t.entry_price.toFixed(2)}</td>
      <td>${t.exit_price.toFixed(2)}</td>
      <td class="${pnlClass}">${fmtPnl(t.realized_pnl)}</td>
      <td style="color:#6b7280">${t.exit_time}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ─── Load Signals on mount ───────
async function loadSignals() {
  try {
    const r = await fetch('/api/signals?limit=100');
    const signals = await r.json();
    if (signals && signals.length > 0) {
      allSignals = signals;
      renderSignals();
    }
  } catch(e) {
    console.warn('Load signals error:', e);
  }
}

// ─── K-line Chart ─────────────────
let chart = null;
let candleSeries = null;
let ma20Series = null;
let ma60Series = null;
let ma120Series = null;
let chartPeriod = '1h';
let chartProduct = 'AU';
let chartRefreshTimer = null;

// Bind chart product switcher
document.getElementById('chartProduct').addEventListener('change', loadChart);
document.querySelectorAll('.period-btn').forEach(b => {
  b.addEventListener('click', function() { switchPeriod(this.dataset.period); });
});

function initChart() {
  if (typeof LightweightCharts === 'undefined') {
    document.getElementById('chartContainer').innerHTML = '<div style="padding:40px;text-align:center;color:#f6465d">K线图库加载失败，请刷新页面重试</div>';
    return;
  }
  if (chart) {
    chart.remove();
    chart = null;
  }
  const container = document.getElementById('chartContainer');
  if (!container) return;

  chart = LightweightCharts.createChart(container, {
    layout: {
      background: {color: '#151920'},
      textColor: '#6b7280',
      fontSize: 11,
    },
    grid: {
      vertLines: {color: '#1f2530'},
      horzLines: {color: '#1f2530'},
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
    },
    timeScale: {
      borderColor: '#1f2530',
      timeVisible: true,
      secondsVisible: false,
    },
    rightPriceScale: {
      borderColor: '#1f2530',
    },
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#0ecb81',
    downColor: '#f6465d',
    borderDownColor: '#f6465d',
    borderUpColor: '#0ecb81',
    wickDownColor: '#f6465d',
    wickUpColor: '#0ecb81',
  });

  ma20Series = chart.addLineSeries({
    color: '#f0b90b',
    lineWidth: 1,
    lastValueVisible: false,
    priceLineVisible: false,
  });

  ma60Series = chart.addLineSeries({
    color: '#e91e63',
    lineWidth: 1,
    lastValueVisible: false,
    priceLineVisible: false,
  });

  ma120Series = chart.addLineSeries({
    color: '#7c4dff',
    lineWidth: 1,
    lastValueVisible: false,
    priceLineVisible: false,
  });

  chart.timeScale().fitContent();
  loadChart();
}

async function loadChart() {
  if (!chart || !candleSeries) return;
  chartProduct = document.getElementById('chartProduct').value;
  try {
    const r = await fetch(`/api/kline?pid=${chartProduct}&interval=${chartPeriod}&limit=300`);
    const data = await r.json();
    if (!data.candles || data.candles.length === 0) return;

    candleSeries.setData(data.candles);
    ma20Series.setData(data.mas.MA20 || []);
    ma60Series.setData(data.mas.MA60 || []);
    ma120Series.setData(data.mas.MA120 || []);
    chart.timeScale().fitContent();
  } catch(e) {
    console.warn('Chart load error:', e);
  }
}

function switchPeriod(period) {
  chartPeriod = period;
  document.querySelectorAll('.period-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.period === period);
  });
  if (!chart) return;
  chart.applyOptions({
    timeScale: {
      timeVisible: period === '1h',
      secondsVisible: false,
    }
  });
  loadChart();
}

// Update last candle in real-time from WebSocket kline data
let chartTickCount = 0;
function updateChartTick(klineData) {
  if (!candleSeries || !chartProduct || !klineData) return;
  const data = klineData[chartProduct];
  if (!data) return;
  const cc = data[chartPeriod] || data['1h'];
  if (!cc || !cc.time) return;
  candleSeries.update({
    time: Math.floor(cc.time),
    open: cc.open,
    high: cc.high,
    low: cc.low,
    close: cc.close,
  });
  // Full reload every 30s to keep MAs aligned
  chartTickCount++;
  if (chartTickCount % 30 === 0) loadChart();
}

// ─── Init ────────────────────────
updateTradeBtn();
updateMarginPreview();
connectWS();
loadSignals();
loadHistory();
initChart();
// Reload history periodically
setInterval(loadHistory, 5000);
</script>
